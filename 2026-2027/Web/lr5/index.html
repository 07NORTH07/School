<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №5</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section>
    <h2>Завдання 1: Температура</h2>
    <p>
      <label for="fahrenheit">Температура за Фаренгейтом</label>
      <input type="text" id="fahrenheit">
    </p>
    <p>
      <label for="celsius">Температура за Цельсієм</label>
      <input type="text" id="celsius">
    </p>
  </section>

  <section>
    <h2>Завдання 2: Таблиця множення</h2>
    <p id="score2"></p>
    <p><button id="next2">наступне завдання</button></p>
    <p>
      <span id="task2"></span>
      <input type="text" id="answer2">
      <button id="check2">перевірити</button>
    </p>
    <p id="result2"></p>
  </section>

  <section>
    <h2>Завдання 3: Таблиця множення (радіокнопки)</h2>
    <p id="score3"></p>
    <p><button id="next3">наступне завдання</button></p>
    <p id="task3"></p>
    <div id="options3"></div>
    <p id="result3"></p>
  </section>

  <section>
    <h2>Завдання 4: Галерея (квіти)</h2>
    <div id="rotator"></div>
  </section>

  <section>
    <h2>Завдання 5: Captcha</h2>
    <div id="captcha"></div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
