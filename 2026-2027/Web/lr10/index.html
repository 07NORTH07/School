<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Товари для футболу</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Товари для футболу</h1>

    <button type="button" id="cart-btn" class="cart-btn" aria-label="Корзина">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.5"/>
        <circle cx="18" cy="20" r="1.5"/>
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20.5 7H6"/>
      </svg>
      <span id="cart-count" class="cart-count" hidden>0</span>
    </button>
  </header>

  <main class="app">
    <h2 class="app__title">Обов'язково додайте своє замовлення</h2>
    <div id="product-list" class="product-list"></div>
  </main>

  <!-- модальне вікно -->
  <div id="modal" class="modal" hidden>
    <div class="modal__box">
      <h3 id="modal-title" class="modal__title"></h3>
      <div id="modal-body" class="modal__body"></div>
      <div id="modal-buttons" class="modal__buttons"></div>
    </div>
  </div>
</body>
</html>
