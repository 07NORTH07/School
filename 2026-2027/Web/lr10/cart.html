<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js" defer></script>
  <script src="js/cart.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Корзина</h1>

    <button type="button" id="cart-btn" class="cart-btn" aria-label="Корзина">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.5"/>
        <circle cx="18" cy="20" r="1.5"/>
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20.5 7H6"/>
      </svg>
      <span id="cart-count" class="cart-count" hidden>0</span>
    </button>
  </header>

  <main class="app">
    <section id="cart-content">
      <h2 class="app__title">Ви обрали:</h2>
      <div class="table-wrap">
        <table class="cart-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Назва товару</th>
              <th>Ціна за од.</th>
              <th>К-сть:</th>
              <th>Сума:</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
          <tfoot>
            <tr>
              <td colspan="4" class="cart-table__total-label">Разом до оплати:</td>
              <td id="cart-total" colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="cart-links">
        <a href="#" id="pay-link" class="btn btn--yellow">Оплатити</a>
        <a href="index.html" class="btn btn--light">Повернутись до покупок</a>
      </div>
    </section>

    <p id="empty-message" class="empty-message" hidden>
      Корзина пуста. <a href="index.html">Повернутись до покупок</a>
    </p>
  </main>

  <!-- модальне вікно -->
  <div id="modal" class="modal" hidden>
    <div class="modal__box">
      <h3 id="modal-title" class="modal__title"></h3>
      <div id="modal-body" class="modal__body"></div>
      <div id="modal-buttons" class="modal__buttons"></div>
    </div>
  </div>
</body>
</html>
