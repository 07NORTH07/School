<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wherever you go, there you are</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>Wherever you go, there you are</h1>

        <div class="buttons">
            <button id="watch" type="button">Watch me</button>
            <button id="clearWatch" type="button">Clear watch</button>
        </div>

        <div id="location">Your location will go here.</div>
        <div id="distance">Distance from College will go here.</div>

        <div id="map"></div>

        <form id="destination-form" class="destination">
            <h2>Пункт призначення</h2>
            <div class="fields">
                <label>Широта <input id="dest-lat" type="number" step="any" min="-90" max="90" value="48.943207"></label>
                <label>Довгота <input id="dest-lng" type="number" step="any" min="-180" max="180" value="24.7333504"></label>
            </div>
            <button type="submit">Показати на карті</button>
            <p id="dest-message"></p>
        </form>
    </main>
</body>
</html>
